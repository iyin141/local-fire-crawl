name: Deploy-to-vm
run-name: ${{ github.actor }} is learning GitHub Actions
on: [push]
jobs:
   check-bats-version:
    runs-on: unbuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v7
       with:
       node-version: '24'
    - run : npm install -g bats
    - run : bots -v