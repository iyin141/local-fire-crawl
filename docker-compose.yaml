name: firecrawl

x-common-service: &common-service
  # NOTE: If you don't want to build the service locally,
  # comment out the build: statement and uncomment the image: statement
  # image: ghcr.io/firecrawl/firecrawl
  build: apps/api

  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  networks:
    - backend
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

x-common-env: &common-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_RATE_LIMIT_URL: ${REDIS_RATE_LIMIT_URL:-${REDIS_URL:-redis://redis:6379}}
  # Points at camoufox-service, which replaced playwright-service in this stack.
  # The api-side engine is still named `playwright` and still speaks the same
  # contract; only what answers on the other end changed.
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://camoufox-service:3000/scrape}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: ${POSTGRES_HOST:-nuq-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-8}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-5}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  MODEL_NAME: ${MODEL_NAME}
  MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
  AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY}
  TEST_API_KEY: ${TEST_API_KEY}
  SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN}
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN}
  SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL}
  LOGGING_LEVEL: ${LOGGING_LEVEL}
  PROXY_SERVER: ${PROXY_SERVER}
  PROXY_USERNAME: ${PROXY_USERNAME}
  PROXY_PASSWORD: ${PROXY_PASSWORD}
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}
  SERPER_API_KEY: ${SERPER_API_KEY}
  # Set NUQ_BACKEND=fdb to run the queue on FoundationDB instead of Postgres
  NUQ_BACKEND: ${NUQ_BACKEND}
  FDB_CLUSTER_FILE: ${NUQ_BACKEND:+/var/fdb/fdb.cluster}

services:
  # The browser-rendering service, replacing the Chromium-based
  # playwright-service that used to occupy this slot. Same request/response
  # contract (so PLAYWRIGHT_MICROSERVICE_URL and the api's `playwright` engine
  # keep working untouched -- only the URL default above changed), but driven by
  # Camoufox with trawl's tiered challenge escalation. See
  # apps/camoufox-service-ts. Named for what it is rather than the engine slot
  # it fills; the api-side engine is still called `playwright` because renaming
  # it would ripple through engines/index.ts, its types and its tests.
  camoufox-service:
    build:
      context: apps/camoufox-service-ts
      # camoufox-js's build-time `fetch` step calls GitHub's API twice
      # (browser binary + GeoIP database) and unauthenticated calls hit
      # GitHub's secondary rate limit after a handful of rebuilds. Sourced
      # from an env var, not committed anywhere -- compose secrets keep it
      # out of image layers and `docker history`, same as the manual
      # `docker build --secret` used during development. Optional: an unset
      # GITHUB_TOKEN just means slower/riskier (but still working) fetches.
      secrets:
        - github_token
    environment:
      # 3000 to match PLAYWRIGHT_MICROSERVICE_URL's default, which the api uses.
      PORT: 3000
      # PROXY_SERVER is the SSRF-guard proxy's own upstream (see api.ts's
      # buildUpstreamProxyUrl) -- unrelated to the two below, which are trawl's
      # Tier 3/4 escalation pools.
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS}
      BLOCK_MEDIA: ${BLOCK_MEDIA}
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
      # Shares Firecrawl's existing redis service rather than standing up a second
      # instance -- trawl's session cache uses a distinct `session:*` key prefix
      # that doesn't collide with any of Firecrawl's own key namespaces (checked
      # against apps/api/src before this was wired in).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      # Named apart from the api's own BROWSER_POOL_SIZE, which means something
      # different (its scrape concurrency, not a count of live browsers). Each
      # Camoufox instance is a real Firefox, so this is the memory dial for the
      # service -- 3 is trawl's own default.
      BROWSER_POOL_SIZE: ${CAMOUFOX_BROWSER_POOL_SIZE:-3}
      # Tier 3/4 datacenter/residential proxy escalation pools (trawl/tiers).
      # Comma-separated URL lists (or *_LIST_FILE, one per line) -- both optional;
      # unset means those tiers simply have no pool proxy to escalate through and
      # fall back to the default SSRF-guard-proxied browser context instead of
      # failing outright.
      PROXY_URL: ${TIER3_PROXY_URL}
      PROXY_LIST_FILE: ${TIER3_PROXY_LIST_FILE}
      RESIDENTIAL_PROXY_URL: ${RESIDENTIAL_PROXY_URL}
      RESIDENTIAL_PROXY_LIST_FILE: ${RESIDENTIAL_PROXY_LIST_FILE}
      # Voluntary sticky handoff on top of the pools above -- hand a domain to a
      # different proxy once one has held it this long, then keep that pairing
      # rested for a while. Both optional; unset keeps the pool's original
      # "sticky until the proxy fails" behaviour. See .env for the rationale
      # (a residential IP that never changes is itself an anomaly signal).
      PROXY_DOMAIN_QUANTUM_MINUTES: ${PROXY_DOMAIN_QUANTUM_MINUTES}
      PROXY_DOMAIN_REST_MINUTES: ${PROXY_DOMAIN_REST_MINUTES}
    depends_on:
      - redis
    # No host port published: like the playwright-service it replaces, this is
    # reached only by the api over the backend network. Publish one temporarily
    # if you need to curl /scrape directly while debugging.
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

  api:
    <<: *common-service
    environment:
      <<: *common-env
      HOST: "0.0.0.0"
      PORT: ${INTERNAL_PORT:-3002}
      EXTRACT_WORKER_PORT: ${EXTRACT_WORKER_PORT:-3004}
      WORKER_PORT: ${WORKER_PORT:-3005}
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-60000}
      ENV: local
    depends_on:
      redis:
        condition: service_started
      camoufox-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "${PORT:-3002}:${INTERNAL_PORT:-3002}"
    volumes:
      - fdb-cluster-file:/var/fdb:ro
    command: node dist/src/harness.js --start-docker
    # Resource limits for Docker Compose (not Swarm)
    # Increase if you have more CPU cores/RAM available
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G

  redis:
    # NOTE: If you want to use Valkey (open source) instead of Redis (source available),
    # uncomment the Valkey statement and comment out the Redis statement.
    # Using Valkey with Firecrawl is untested and not guaranteed to work. Use with caution.
    image: redis:alpine
    # image: valkey/valkey:alpine

    networks:
      - backend
    command: redis-server --bind 0.0.0.0
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - backend
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  nuq-postgres:
    # NOTE: If you don't want to build the image locally,
    # comment out the build: statement and uncomment the image: statement
    # image: ghcr.io/firecrawl/nuq-postgres:latest
    build: apps/nuq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # FoundationDB queue backend (experimental). Enable by setting
  # NUQ_BACKEND=fdb; the api container reads the shared cluster file from the
  # fdb-cluster-file volume. Replaces nuq-postgres once stable.
  foundationdb:
    image: foundationdb/foundationdb:7.3.63
    environment:
      FDB_NETWORKING_MODE: container
      FDB_COORDINATOR_PORT: 4500
    networks:
      - backend
    volumes:
      - fdb-data:/var/fdb/data
      - fdb-cluster-file:/var/fdb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # one-shot: creates the database on first boot (no-op afterwards)
  foundationdb-init:
    image: foundationdb/foundationdb:7.3.63
    depends_on:
      - foundationdb
    entrypoint:
      - /bin/bash
      - -c
      - "sleep 5 && out=$(fdbcli -C /var/fdb/fdb.cluster --exec 'configure new single ssd' 2>&1); status=$$?; printf '%s\n' \"$$out\"; if [ \"$$status\" -eq 0 ]; then exit 0; fi; printf '%s\n' \"$$out\" | grep -Eiq 'already.*configured|database.*configured|database.*already exists'"
    volumes:
      - fdb-cluster-file:/var/fdb
    networks:
      - backend
    restart: "no"

networks:
  backend:
    driver: bridge

volumes:
  fdb-data:
  fdb-cluster-file:

secrets:
  # Optional -- an unset GITHUB_TOKEN just means camoufox-service's build
  # makes unauthenticated GitHub API calls (still works, just closer to
  # rate limits on repeated builds). See camoufox-service's build.secrets
  # comment above.
  github_token:
    environment: GITHUB_TOKEN
